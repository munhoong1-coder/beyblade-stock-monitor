name: Beyblade Monitor

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install
      run: |
        pip install -r requirements.txt

    - name: Run monitor
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}

      run: python monitor.py
